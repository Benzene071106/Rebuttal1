# Render Blueprint: New > Blueprint, pick this repo, then paste the keys when asked.
# Postgres (cases, rules, incidents and seller accounts) is not created here: Render's
# free databases expire after 30 days, so paste a connection string from any Postgres,
# for example Neon's free tier, as DATABASE_URL. Leave it empty to run the demo without
# seller accounts.

services:
  - type: web
    name: rebuttal
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start # binds to $PORT (see package.json)
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Opens on the simulator so judges can try every step; the inbox switches to the
      # live PayPal sandbox when the PayPal keys below are set.
      - key: PAYPAL_MODE
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      # Seller accounts: the database, and the key that encrypts sellers' PayPal secrets
      # (Render generates a random one; keep it, or every seller has to reconnect PayPal).
      - key: DATABASE_URL
        sync: false
      - key: REBUTTAL_SECRET_KEY
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Optional
      - key: GEMINI_MODEL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
